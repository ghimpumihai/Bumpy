name: CI - Android app

on:
  push:
    branches: [staging] # main only receives release PRs, which run these checks on the same tree
    paths:
      - "mobile/mobile-android/**"
      # The tests compare against the iPhone app's fixtures, and check_contract.py runs the ingest validator.
      - "mobile/mobile-ios/tools/fixtures/**"
      - "services/ingest/ingest_core/**"
      - ".github/workflows/android-app.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "mobile/mobile-android/**"
      - "mobile/mobile-ios/tools/fixtures/**"
      - "services/ingest/ingest_core/**"
      - ".github/workflows/android-app.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests, contract check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/mobile-android
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            mobile/mobile-android/**/*.gradle.kts
            mobile/mobile-android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12" # the ingest function's

      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      # The bodies the tests just wrote, through the validator the ingest function runs.
      - name: Ingest contract check
        run: python -I tools/check_contract.py

      # Lint errors fail, warnings don't. The release build is signed with a throwaway debug key here.
      - name: Lint and release build
        run: ./gradlew --no-daemon --console=plain :app:lintDebug :app:assembleRelease

      - name: Keep the reports of a failed run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: android-reports
          path: |
            mobile/mobile-android/app/build/reports/
            mobile/mobile-android/app/build/test-results/
          if-no-files-found: ignore
