name: dashboard-ci

# The dashboard's "done" definition (dashboard/CLAUDE.md): typecheck, lint, dependency rules, unit tests,
# build, and the end-to-end suite (mock backend + the read-API contract server, axe-core in both themes).
# `real-api` runs the dashboard against services/read-api itself on a PostGIS seeded through the
# processor's write path, so a change on either side that breaks the other fails here.

on:
  pull_request:
    paths:
      - "dashboard/**"
      - "services/read-api/**"
      - "services/processor/roadride/**"
      - "db/**"
      - ".github/workflows/dashboard-ci.yml"
      - "!**/*.md"
  push:
    branches: [main, staging] # staging: the integration branch before main (no deploys)
    paths:
      - "dashboard/**"
      - "services/read-api/**"
      - "services/processor/roadride/**"
      - "db/**"
      - ".github/workflows/dashboard-ci.yml"
      - "!**/*.md"

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Typecheck, lint, dependency rules, unit tests
        run: npm run check

      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (builds the site itself)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: dashboard/test-results/
          if-no-files-found: ignore

  real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          # Throwaway container reachable only from this job: no password at all.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: roadride_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: roadride_e2e
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/read-api/requirements.txt
            services/processor/requirements.txt

      - name: Install the read API and the processor
        run: |
          python -m pip install -r ../services/read-api/requirements.txt -r ../services/processor/requirements.txt
          echo "REAL_API_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Dashboard against the real read API
        run: npx playwright test --project real-api

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-real-api
          path: dashboard/test-results/
          if-no-files-found: ignore
