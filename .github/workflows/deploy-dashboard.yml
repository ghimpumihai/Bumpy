name: CD - Dashboard website

# Builds the dashboard and uploads it to the Static Web App (plan §13). config.json is written here
# from the read API's address, so the deployed site uses the real API; the committed public/config.json
# stays empty for the mock backend.
# Called by release.yml (D57), after deploy-services when both are released, so the site never goes live
# before the read API it needs; no trigger of its own.

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  READ_API_APP: ca-roadride-read-api
  STATIC_WEB_APP: stapp-roadride-dashboard

jobs:
  # The same tests as on the PR, on the code being deployed: failing tests never ship.
  test:
    name: Tests
    uses: ./.github/workflows/dashboard-ci.yml
    permissions:
      contents: read

  deploy:
    name: Build and upload to Static Web Apps
    # Production deploys only from main: a manual run started from staging or any other branch
    # is skipped instead of shipping unmerged code to prod.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Log in to Azure (OIDC, deploy identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find the read API and check it answers the site
        id: api
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null
          fqdn=$(az containerapp show -n "$READ_API_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          site="https://$(az staticwebapp show -n "$STATIC_WEB_APP" -g "$RG" --query defaultHostname -o tsv)"
          base="https://$fqdn"
          # Ask the way the browser will: from the site's origin. A JSON 500 (database down, migration
          # missing) or a missing CORS header would break every page, so both fail the deploy.
          headers=$(mktemp)
          read -r status ctype < <(curl -sS -o /dev/null -D "$headers" -H "Origin: $site" \
            -w '%{http_code} %{content_type}\n' "$base/api/overview" || echo "000 none")
          allow=$(grep -i '^access-control-allow-origin:' "$headers" | tr -d '\r' | cut -d' ' -f2- || true)
          if [ "$status" != "200" ]; then
            echo "::error::$base/api/overview answered HTTP $status. Deploy the read API first (deploy-services) and check its logs."; exit 1
          fi
          case "$ctype" in
            application/json*) ;;
            *) echo "::error::$base/api/overview did not return JSON ($ctype). Deploy the read API first (deploy-services)."; exit 1 ;;
          esac
          if [ "$allow" != "$site" ] && [ "$allow" != "*" ]; then
            echo "::error::The read API does not allow the site's origin $site (Access-Control-Allow-Origin: '${allow}'). Check CORS_ALLOWED_ORIGINS."; exit 1
          fi
          echo "read API OK at $base for $site"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Install npm packages
        run: npm ci

      - name: Build and point the site at the read API
        run: |
          npm run build
          printf '{ "apiBase": "%s" }\n' "${{ steps.api.outputs.base }}" > dist/config.json
          cat dist/config.json

      - name: Get the deployment token (never stored in GitHub)
        id: token
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          token=$(az staticwebapp secrets list -n "$STATIC_WEB_APP" -g "$RG" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "value=$token" >> "$GITHUB_OUTPUT"

      - name: Upload the site
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.value }}
          action: upload
          app_location: dashboard/dist
          skip_app_build: true
          skip_api_build: true
