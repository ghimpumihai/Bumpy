name: CD - Ingest function

# Deploys services/ingest to the Flex Consumption function app (plan §13). Called by release.yml, which
# decides when and in what order (D57); no trigger of its own.
# Logs in with GitHub OIDC; no Azure secrets are stored. Needs, once:
#   - a GitHub environment named `prod` (its federated credential is created by infra/bootstrap)
#   - repo variables AZURE_CLIENT_ID_DEPLOY, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     (from `terraform -chdir=infra/bootstrap output github_variables`), INGEST_FUNCTION_APP
#     (from `./infra/tf.ps1 output -raw ingest_function_name`) and RESOURCE_GROUP (rg-roadride)
# After the deploy it checks that the function host really runs (see "Smoke check" below).

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  # The same tests as on the PR, on the code being deployed: failing tests never ship.
  test:
    name: Tests
    uses: ./.github/workflows/ingest-ci.yml
    permissions:
      contents: read

  deploy:
    name: Deploy to the function app
    # Production deploys only from main: a manual run started from staging or any other branch
    # is skipped instead of shipping unmerged code to prod.
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to Azure (OIDC, deploy identity)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # azurerm 4.x writes a key-based AzureWebJobsStorage (with an empty AccountKey) on every apply that
      # touches the function app (terraform-provider-azurerm#29149). Keys are off on the storage account,
      # so the host can't take its lock lease and never starts. Remove it; the identity settings stay.
      - name: Host storage uses the managed identity only
        env:
          APP: ${{ vars.INGEST_FUNCTION_APP }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: |
          names=$(az functionapp config appsettings list -n "$APP" -g "$RG" --query '[].name' -o tsv)
          if printf '%s\n' "$names" | grep -qx 'AzureWebJobsStorage'; then
            echo "Removing the key-based AzureWebJobsStorage setting (provider bug, infra/README.md)"
            az functionapp config appsettings delete -n "$APP" -g "$RG" --setting-names AzureWebJobsStorage --output none
            names=$(az functionapp config appsettings list -n "$APP" -g "$RG" --query '[].name' -o tsv)
          fi
          if printf '%s\n' "$names" | grep -qx 'AzureWebJobsStorage'; then
            echo "::error::AzureWebJobsStorage is still set on $APP"; exit 1
          fi
          for s in AzureWebJobsStorage__accountName AzureWebJobsStorage__credential AzureWebJobsStorage__clientId; do
            if ! printf '%s\n' "$names" | grep -qx "$s"; then
              echo "::error::$APP has no $s setting. Run ./infra/tf.ps1 apply (it sets them)."; exit 1
            fi
          done
          echo "host storage: identity-based settings only"

      - name: Package (app files only)
        working-directory: services/ingest
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          cp function_app.py host.json requirements.txt "$RUNNER_TEMP/pkg/"
          cp -r ingest_core "$RUNNER_TEMP/pkg/"
          find "$RUNNER_TEMP/pkg" -name __pycache__ -prune -exec rm -rf {} +

      - name: Deploy the package (remote build)
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.INGEST_FUNCTION_APP }}
          package: ${{ runner.temp }}/pkg
          sku: flexconsumption
          remote-build: true

      - name: Smoke check (host runs, routes answer, Key Vault readable)
        env:
          APP: ${{ vars.INGEST_FUNCTION_APP }}
          RG: ${{ vars.RESOURCE_GROUP }}
        run: bash .github/scripts/ingest-smoke.sh
