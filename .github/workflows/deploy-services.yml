name: deploy-services

# Builds the processor and read API images, runs the migrate job and waits for it, then updates the
# finalize and aggregate jobs, the stream processor and the read API (plan §13). Migrations always run before new code sees the database.
# Needs the `prod` environment and the repo variables AZURE_CLIENT_ID_DEPLOY, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, ACR_NAME and RESOURCE_GROUP.

on:
  push:
    branches: [main]
    paths:
      - "services/processor/**"
      - "services/read-api/**"
      - "db/**"
      - ".github/workflows/deploy-services.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-services
  cancel-in-progress: false

env:
  MIGRATE_JOB: caj-roadride-migrate
  FINALIZE_JOB: caj-roadride-finalize
  AGGREGATE_JOB: caj-roadride-aggregate
  PROCESSOR_APP: ca-roadride-processor
  READ_API_APP: ca-roadride-read-api
  READ_API_PORT: "8000" # where the read-api image listens (services/read-api/Dockerfile)

jobs:
  deploy:
    # Production deploys only from main: a manual run started from staging or any other branch
    # is skipped instead of shipping unmerged code to prod.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_DEPLOY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the images
        id: image
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR_NAME"
          tag="${GITHUB_SHA::12}"
          processor="$ACR_NAME.azurecr.io/processor:$tag"
          read_api="$ACR_NAME.azurecr.io/read-api:$tag"
          docker build -f services/processor/Dockerfile -t "$processor" .
          docker build -t "$read_api" services/read-api
          docker push "$processor"
          docker push "$read_api"
          echo "processor=$processor" >> "$GITHUB_OUTPUT"
          echo "read_api=$read_api" >> "$GITHUB_OUTPUT"

      - name: Run the migrate job and wait for it
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          IMAGE: ${{ steps.image.outputs.processor }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt >/dev/null
          az containerapp job update -n "$MIGRATE_JOB" -g "$RG" --image "$IMAGE" --output none
          execution=$(az containerapp job start -n "$MIGRATE_JOB" -g "$RG" --query name -o tsv)
          echo "execution: $execution"
          for i in $(seq 1 60); do
            status=$(az containerapp job execution show -n "$MIGRATE_JOB" -g "$RG" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            echo "status: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) break ;;
            esac
            sleep 10
          done
          echo "::error::migrate job did not succeed (status: $status). Logs: Log Analytics, ContainerAppConsoleLogs_CL where ContainerJobName_s == '$MIGRATE_JOB'"
          exit 1

      - name: Update the stream processor and the finalize and aggregate jobs
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          IMAGE: ${{ steps.image.outputs.processor }}
        run: |
          # Jobs first: the processor starts sending "session ready" as soon as it runs the new code.
          az containerapp job update -n "$FINALIZE_JOB" -g "$RG" --image "$IMAGE" --output none
          az containerapp job update -n "$AGGREGATE_JOB" -g "$RG" --image "$IMAGE" --output none
          az containerapp update -n "$PROCESSOR_APP" -g "$RG" --image "$IMAGE" --output none

      - name: Update the read API
        env:
          RG: ${{ vars.RESOURCE_GROUP }}
          IMAGE: ${{ steps.image.outputs.read_api }}
        run: |
          az containerapp update -n "$READ_API_APP" -g "$RG" --image "$IMAGE" --output none
          # Terraform creates the app on port 80 for the placeholder image and then ignores the port, so
          # only the first deploy to a fresh stack changes it; after that it is already 8000. The image goes
          # first: until the port follows, the placeholder revision keeps serving.
          port=$(az containerapp show -n "$READ_API_APP" -g "$RG" --query properties.configuration.ingress.targetPort -o tsv)
          if [ "$port" != "$READ_API_PORT" ]; then
            echo "ingress target port $port -> $READ_API_PORT"
            az containerapp ingress update -n "$READ_API_APP" -g "$RG" --target-port "$READ_API_PORT" --output none
          fi
          fqdn=$(az containerapp show -n "$READ_API_APP" -g "$RG" --query properties.configuration.ingress.fqdn -o tsv)
          # Wait for the new revision, then require every database-backed route to answer 200. Together
          # they read every table and PostGIS function, and PostgreSQL checks the `reader` role's
          # grants even when the tables are empty, so this proves the API can serve every page.
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/api/overview" || true)
            echo "GET /api/overview -> $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          failed=0
          for route in /api/overview /api/sessions /api/quality /api/live "/api/segments?vehicle=all"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "https://$fqdn$route" || true)
            echo "GET $route -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::read API answered $code on $route: $(head -c 300 /tmp/body)"
              failed=1
            fi
          done
          exit $failed
