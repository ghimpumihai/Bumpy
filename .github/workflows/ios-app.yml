name: iOS app

on:
  push:
    paths: ["src/mobile-ios/**", ".github/workflows/ios-app.yml"]
  pull_request:
    paths: ["src/mobile-ios/**", ".github/workflows/ios-app.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/mobile-ios
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Build for device (unsigned, Release)
        run: |
          xcodebuild -project SensorRecorder.xcodeproj -scheme SensorRecorder \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
          test ${PIPESTATUS[0]} -eq 0

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x["udid"]) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t: [int(p) for p in t[0].split("iOS-")[-1].split("-")])
          print(c[-1][1])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          xcodebuild -project SensorRecorder.xcodeproj -scheme SensorRecorder \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:SensorRecorderTests -resultBundlePath TestResults.xcresult test | tail -40
          test ${PIPESTATUS[0]} -eq 0

      - name: Python tools self-check
        run: python3 -m py_compile tools/*.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/mobile-ios/TestResults.xcresult
