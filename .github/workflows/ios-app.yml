name: iOS app

on:
  push:
    branches: [main, staging] # staging: the integration branch before main (no deploys)
    paths:
      - "src/mobile-ios/**"
      - "!src/mobile-ios/**/*.md"
      - ".github/workflows/ios-app.yml"
  pull_request:
    paths:
      - "src/mobile-ios/**"
      - "!src/mobile-ios/**/*.md"
      - ".github/workflows/ios-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # quick_check.py / mock_ingest_server.py (stdlib only) on:
  #  - macOS system Python (/usr/bin/python3 = Apple's 3.9.x): exactly what the team laptops run;
  #  - the current Python on Ubuntu: forward compatibility.
  # (setup-python has no 3.9 builds for ubuntu-latest = Ubuntu 26.04, so 3.9 comes from macOS.)
  tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: /usr/bin/python3
          - os: ubuntu-latest
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.x'

      - name: Python tools tests
        run: |
          ${{ matrix.python }} --version
          ${{ matrix.python }} -I src/mobile-ios/tools/test_tools.py -v

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/mobile-ios
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          if [ -z "$XCODE" ] && [ -d /Applications/Xcode.app ]; then
            XCODE=/Applications/Xcode.app
          fi
          if [ -z "$XCODE" ]; then
            echo "::error::No non-beta Xcode found in /Applications"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Selected $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick a simulator and start booting it
        id: sim
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x["udid"]) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t: [int(p) for p in t[0].split("iOS-")[-1].split("-")])
          print(c[-1][1])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boots while the next steps compile; xcodebuild waits for it if it isn't ready yet.
          nohup xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 &

      # Pull requests skip the Release device build to save a minute; main still checks it.
      - name: Build for device (unsigned, Release)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          mkdir -p build-logs
          xcodebuild -project SensorRecorder.xcodeproj -scheme SensorRecorder \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-logs/build-device.log

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build-logs
          xcodebuild -project SensorRecorder.xcodeproj -scheme SensorRecorder \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:SensorRecorderTests -resultBundlePath TestResults.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO test 2>&1 \
            | tee build-logs/unit-tests.log

      # The unit tests regenerate tools/fixtures/ingest_batch_v1.json.gz from the app's real
      # encoder; the tools suite POSTs it to the mock backend (cross-language contract test).
      - name: Python tools tests (contract test against the fresh fixture)
        run: |
          set -o pipefail
          python3 --version
          if [ ! -f tools/fixtures/ingest_batch_v1.json.gz ]; then
            echo "::error::tools/fixtures/ingest_batch_v1.json.gz was not generated by the unit tests"
            exit 1
          fi
          python3 -I tools/test_tools.py -v 2>&1 | tee build-logs/tools-tests.log

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: src/mobile-ios/build-logs/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/mobile-ios/TestResults.xcresult
          if-no-files-found: ignore
