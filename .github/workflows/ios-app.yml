name: CI - iPhone app

on:
  push:
    branches: [staging] # main only receives release PRs, which run these checks on the same tree
    paths:
      - "mobile/mobile-ios/**"
      - "!mobile/mobile-ios/**/*.md"
      - ".github/workflows/ios-app.yml"
  pull_request:
    paths:
      - "mobile/mobile-ios/**"
      - "!mobile/mobile-ios/**/*.md"
      - ".github/workflows/ios-app.yml"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # quick_check.py / mock_ingest_server.py (stdlib only) on:
  #  - macOS system Python (/usr/bin/python3 = Apple's 3.9.x): exactly what the team laptops run;
  #  - the current Python on Ubuntu: forward compatibility.
  # (setup-python has no 3.9 builds for ubuntu-latest = Ubuntu 26.04, so 3.9 comes from macOS.)
  tools:
    name: Python tools tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: /usr/bin/python3
          - os: ubuntu-latest
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.x'

      - name: Python tools tests
        run: |
          ${{ matrix.python }} --version
          ${{ matrix.python }} -I mobile/mobile-ios/tools/test_tools.py -v

  build-and-test:
    name: Xcode build and unit tests
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/mobile-ios
        shell: bash
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select latest stable Xcode
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          if [ -z "$XCODE" ] && [ -d /Applications/Xcode.app ]; then
            XCODE=/Applications/Xcode.app
          fi
          if [ -z "$XCODE" ]; then
            echo "::error::No non-beta Xcode found in /Applications"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Selected $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick a simulator and start booting it
        id: sim
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[(rt,x["udid"]) for rt,xs in d.items() if "iOS" in rt for x in xs if x["name"].startswith("iPhone")]
          c.sort(key=lambda t: [int(p) for p in t[0].split("iOS-")[-1].split("-")])
          print(c[-1][1])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boots while the next steps compile; xcodebuild waits for it if it isn't ready yet.
          nohup xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 &

      # Pull requests skip the Release device build to save a minute; the push to staging checks it.
      - name: Build for device (unsigned, Release)
        if: github.event_name != 'pull_request'
        run: |
          set -o pipefail
          mkdir -p build-logs
          xcodebuild -project SensorRecorder.xcodeproj -scheme SensorRecorder \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-logs/build-device.log

      - name: Unit tests
        run: |
          set -o pipefail
          mkdir -p build-logs
          xcodebuild -project SensorRecorder.xcodeproj -scheme SensorRecorder \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:SensorRecorderTests -resultBundlePath TestResults.xcresult \
            COMPILER_INDEX_STORE_ENABLE=NO test 2>&1 \
            | tee build-logs/unit-tests.log

      # The unit tests check that the app's real encoder still produces the committed
      # tools/fixtures/*.json.gz byte for byte (they never rewrite them); the `tools` job POSTs the same
      # fixtures to the mock backend (cross-language contract test).
      - name: Keep the build logs and test results of a failed run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: build-logs-and-test-results
          path: |
            mobile/mobile-ios/build-logs/
            mobile/mobile-ios/TestResults.xcresult
          if-no-files-found: ignore
