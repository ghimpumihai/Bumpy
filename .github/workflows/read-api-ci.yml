name: read-api-ci

on:
  pull_request:
    paths:
      - "services/read-api/**"
      - "services/processor/roadride/**"
      - "db/**"
      - ".github/workflows/read-api-ci.yml"
      - "!**/*.md"
  push:
    branches: [main]
    paths:
      - "services/read-api/**"
      - "db/**"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/read-api/requirements.txt
            services/processor/requirements.txt

      # The tests seed data through the processor's Store, so both packages are installed.
      - name: Install
        run: pip install -r services/read-api/requirements.txt -r services/processor/requirements.txt pytest httpx

      - name: Tests (read API against PostGIS, data written by the processor)
        working-directory: services/read-api
        run: pytest -q -rs tests

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker image builds and starts
        run: |
          docker build -t read-api:ci services/read-api
          docker run -d --name api -p 8000:8000 read-api:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/nothing || true)
            [ "$code" = "404" ] && echo "listening on 8000 as non-root" && exit 0
            sleep 1
          done
          docker logs api; exit 1
