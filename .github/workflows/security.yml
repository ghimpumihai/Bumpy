name: security

# Plan 02 §13: gitleaks scans for committed secrets (keys, tokens, connection strings) on every PR and
# every push to main or staging. It scans the whole history, so a secret removed in a later commit is still found:
# rotate it, don't just delete it. False positives go in a .gitleaksignore file (fingerprints).
# The gitleaks binary is pinned by version and SHA-256, so no third-party action runs here.

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  # gitleaks_8.30.1_linux_x64.tar.gz in gitleaks_8.30.1_checksums.txt of the GitHub release
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
