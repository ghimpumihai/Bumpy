name: CI - Upload tool

on:
  pull_request:
    paths:
      - "tools/upload/**"
      - ".github/workflows/upload-ci.yml"
      - "!**/*.md"
  push:
    branches: [staging] # main only receives release PRs, which run these checks on the same tree
    paths:
      - "tools/upload/**"
      - ".github/workflows/upload-ci.yml"
      - "!**/*.md"

permissions:
  contents: read

jobs:
  test:
    name: Upload tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The tool itself is standard library only; the finalize side of the same folders is tested in
      # processor-ci (services/processor/tests/test_upload.py).
      - name: Install pytest
        run: pip install pytest

      - name: Tests (fake Blob Storage over HTTP)
        run: pytest -q tools/upload
