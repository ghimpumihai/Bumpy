# Local PostGIS for development and tests (plan §15). Same major versions as Azure (PostgreSQL 17).
# The password comes from your environment (or a gitignored .env next to this file), never the repo:
#   $env:POSTGRES_PASSWORD='<pick one>'; docker compose up -d db
# Then, from services/processor:
#   $env:PGHOST='localhost'; $env:PGPORT='5433'; $env:PGUSER='postgres'; $env:PGPASSWORD=$env:POSTGRES_PASSWORD; $env:PGDATABASE='roadride'
#   $env:RUN_MODE='migrate'; python -m roadride
#   python -m pytest -q tests      # integration tests run when PGHOST and PGPASSWORD are set
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      # Pass-through: taken from your shell; the container refuses to start without it.
      - POSTGRES_PASSWORD
      - POSTGRES_DB=roadride
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
