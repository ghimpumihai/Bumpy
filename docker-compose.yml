# Local PostGIS for development and tests (plan §15). Same major versions as Azure (PostgreSQL 17).
# Trust login with no password, reachable only from this machine (127.0.0.1).
#   docker compose up -d db
# Then, from services/processor:
#   $env:PGHOST='localhost'; $env:PGPORT='5433'; $env:PGUSER='postgres'; $env:PGDATABASE='roadride'
#   $env:RUN_MODE='migrate'; python -m roadride
#   python -m pytest -q tests      # integration tests run when PGHOST is set
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: roadride
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
